<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graph Explorer</title>
    <link rel="stylesheet" type="text/css" href="static/styles.css">
    
    <script type="module" src="static/misc/site_ui_element_controls.js"></script>
    <script type="module" src="static/classes/zoom.js"></script>
    <script type="module" src="static/classes/pan.js"></script>
    
    <script type="module" src="static/classes/layout_adjustment_calculator.js"></script>
    <script type="module" src="static/classes/layout_config_manager.js"></script>
    
    <script type="module" src="static/classes/force_pair.js"></script>
    <script type="module" src="static/classes/graph.js"></script>
    <script type="module" src="static/classes/graph_manager.js"></script>

    <script type="module" src="static/tests/graph_test.js"></script>

    <script type="module" src="static/main.js"></script>

</head>
<body>

    <header>
        <div class="container">
            <h1><a href="index.html">Graph Explorer</a></h1>
            <div class="header-controls">
                <nav>
                    <button class="dropdown-toggle">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>


                    <ul class="dropdown-items" role="menu">
                    <div class="slider-container">
                        <li>
                        <label for="repulsion">Repulsion:</label>
                        <input type="range" id="repulsion" min="50" max="350" value="100">
                        </li>

                        <li>
                        <label for="attraction">Attraction:</label>
                        <input type="range" id="attraction" min="0.01" max="0.35" step="0.01" value="0.20">
                        </li>

                        <li>
                        <label for="damping">Damping:</label>
                        <input type="range" id="damping" min="0.0" max="1" step="0.01" value="0.85">
                        </li>
                    </div>
                    </ul>

                </nav>
            </div>
        </div>
    </header>

    <main>
        
        <div class="graph" id="graph-1">
            
            <svg class="graph-canvas" viewBox="0 0 600 400">

                <!-- defs: reusable svg defined shapes, in our cas, our arrowhead -->
                <defs>
                    <marker id="arrowhead"
                            markerWidth="22.5"
                            markerHeight="22.5"
                            refX="40"
                            refY="11.25"
                            orient="auto"
                            markerUnits="userSpaceOnUse">
                        <polygon points="0 0, 22.5 11.25, 0 22.5"
                            fill="context-stroke"/>
                    </marker>
                </defs>

                <g class="zoom-content">
                    <g class="pan-content">

                        <!-- Edges -->
                        <g class="edges">
                            
                            <!--
                                THE PATH ELEMENT: 
                                M 50 100 = start at the left end
                                Q quadratic "bezier" curve
                                300 0 = put the control point of the bend there
                                (BY DEFAULT set it to the line's center point!)
                                250 100 = end at the right end
                            -->


                            <path class="edge"
                                source-node="A"
                                destination-node="B"
                                d="M 150 100 Q 225 150 300 200"
                            />          

                            <path class="edge"
                                source-node="A"
                                destination-node="C"
                                directed="true"
                                d="M 150 100 Q 300 150 450 200"
                            />

                            <path class="edge"
                                source-node="A"
                                destination-node="C"
                                directed="true"
                                d="M 150 100 Q 300 150 450 200"
                            />

                            <path class="edge"
                                source-node="C"
                                destination-node="A"
                                directed="true"
                                d="M 150 100 Q 300 150 450 200"
                            />

                            <path class="edge"
                                source-node="B"
                                destination-node="C"
                                d="M 300 200 Q 325 200 450 200"
                            />

                        </g>

                        <!-- Nodes -->
                        <g class="nodes">
                            <g class="node" data-node-id="A" transform="translate(150, 100)">
                                <circle/>
                                <text text-anchor="middle" dy="5">A</text>
                            </g>

                            <g class="node" data-node-id="B" transform="translate(300, 200)">
                                <circle/>
                                <text text-anchor="middle" dy="5">B</text>
                            </g>

                            <g class="node" data-node-id="C" transform="translate(450, 200)">
                                <circle/>
                                <text text-anchor="middle" dy="5">C</text>
                            </g>
                        </g>

                    </g>
                </g>
            </svg>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 All Project Team Members</p>
    </footer>

</body>
</html>
